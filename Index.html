<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FocusFlow | To-Do App</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 30px 15px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #e8eaff, #e0f7f1);
            color: #252640;
        }

        #home {
            width: 100%;
            max-width: 600px;
            margin: 30px auto;
            padding: 30px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 15px 45px rgba(50, 40, 100, 0.13);
        }

        .subtitle {
            color: #85869a;
            margin-bottom: 25px;
        }

        h1 {
            margin-bottom: 8px;
            font-size: 35px;
        }

        .add-area {
            display: flex;
            gap: 10px;
        }

        input,
        select,
        button {
            font: inherit;
        }

        #taskInput {
            flex: 1;
            min-width: 0;
            padding: 13px;
            border: 1px solid #e2e2ed;
            border-radius: 10px;
            outline: none;
        }

        #taskInput:focus {
            border-color: #7955e8;
            box-shadow: 0 0 0 3px #7955e820;
        }

        button {
            border: none;
            border-radius: 10px;
            padding: 12px 15px;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            transform: translateY(-1px);
        }

        #add {
            color: white;
            background: #7955e8;
            font-weight: bold;
        }

        #priorityInput {
            width: 100%;
            margin-top: 12px;
            padding: 12px;
            border: 1px solid #e2e2ed;
            border-radius: 10px;
            background: white;
        }

        .summary {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-top: 28px;
        }

        #taskCounter {
            color: #85869a;
            font-size: 13px;
        }

        .filters {
            display: flex;
            gap: 8px;
            margin: 18px 0;
        }

        .filter-btn {
            background: #f2f1fa;
            color: #77778b;
        }

        .filter-btn.active {
            color: white;
            background: #7955e8;
        }

        #taskList {
            display: grid;
            gap: 10px;
            padding: 0;
            list-style: none;
        }

        .task-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px;
            border: 1px solid #ededf4;
            border-radius: 12px;
            background: #fff;
        }

        .check-btn {
            width: 28px;
            height: 28px;
            padding: 0;
            border: 2px solid #d8d7e8;
            border-radius: 8px;
            color: white;
            background: white;
        }

        .completed .check-btn {
            border-color: #2eaf87;
            background: #2eaf87;
        }

        .task-content {
            flex: 1;
            min-width: 0;
            overflow-wrap: anywhere;
        }

        .completed .task-text {
            color: #999aaa;
            text-decoration: line-through;
        }

        .task-meta {
            display: flex;
            gap: 8px;
            margin-top: 6px;
            font-size: 12px;
        }

        .priority {
            padding: 4px 8px;
            border-radius: 20px;
            font-weight: bold;
        }

        .priority-high {
            color: #c3344e;
            background: #ffe8ed;
        }

        .priority-medium {
            color: #94620a;
            background: #fff1d2;
        }

        .priority-low {
            color: #237d63;
            background: #def7ed;
        }

        .status {
            color: #85869a;
        }

        .delete-btn {
            width: 38px;
            height: 38px;
            padding: 0;
            color: #e65369;
            background: #fff0f2;
        }

        .empty {
            padding: 25px 10px;
            color: #85869a;
            text-align: center;
            line-height: 1.6;
        }

        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-top: 20px;
            padding-top: 18px;
            border-top: 1px solid #ededf4;
        }

        #footerNote {
            color: #85869a;
            font-size: 12px;
        }

        #clearCompleted {
            color: #e65369;
            background: #fff0f2;
            font-size: 13px;
        }

        @media (max-width: 480px) {
            #home {
                padding: 22px 16px;
            }

            h1 {
                font-size: 29px;
            }

            .add-area {
                flex-wrap: wrap;
            }

            #taskInput {
                width: 100%;
                flex-basis: 100%;
            }

            .footer {
                align-items: flex-start;
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <main id="home">

        <p style="color:#7955e8;font-weight:bold;">
            YOUR PERSONAL PLANNER
        </p>

        <h1>FocusFlow ✨</h1>

        <p class="subtitle">
            Make space for what matters. One task at a time.
        </p>

        <form id="taskForm">

            <div class="add-area">
                <input
                    type="text"
                    id="taskInput"
                    placeholder="What do you need to do?"
                    maxlength="180"
                    autocomplete="off"
                >

                <button type="submit" id="add">
                    + Add Task
                </button>
            </div>

            <select id="priorityInput">
                <option value="medium">Medium Priority</option>
                <option value="high">High Priority</option>
                <option value="low">Low Priority</option>
            </select>

        </form>

        <div class="summary">
            <strong id="summaryTitle">Your Tasks</strong>
            <span id="taskCounter">0 tasks left</span>
        </div>

        <div class="filters">
            <button class="filter-btn active" data-filter="all" type="button">
                All
            </button>

            <button class="filter-btn" data-filter="active" type="button">
                Active
            </button>

            <button class="filter-btn" data-filter="completed" type="button">
                Completed
            </button>
        </div>

        <ul id="taskList"></ul>

        <div class="footer">
            <span id="footerNote">
                Your tasks are saved on this device.
            </span>

            <button id="clearCompleted" type="button">
                Clear Completed
            </button>
        </div>

    </main>

    <script src="./script.js"></script>

</body>
</html>
